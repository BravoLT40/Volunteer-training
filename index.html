<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Pi Academy - Florida Camp Volunteer Training</title>
  <style>
    :root {
      --primary: #f99d1e; /* Pi Academy Orange */
      --primary-dark: #d8800b;
      --primary-light: #fff5e6;
      --secondary: #1b80c4; /* Pi Academy Blue */
      --secondary-dark: #14669e;
      --secondary-light: #eef7fc;
      --accent: #1b80c4; /* Pi Academy Blue */
      --warning: #f59e0b;
      --dark: #0f172a;
      --slate: #475569;
      --light-bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    :focus-visible {
      outline: 2px solid var(--secondary);
      outline-offset: 2px;
    }

    body {
      background-color: var(--light-bg);
      color: var(--dark);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 360px;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      border-right: 1px solid #1e293b;
    }

    .brand {
      padding: 20px 20px;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      background: #ffffff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 2px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand-title h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
    }

    .brand-title p {
      font-size: 0.74rem;
      color: #94a3b8;
    }

    .progress-bar-container {
      padding: 14px 20px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #cbd5e1;
    }

    .progress-track {
      height: 8px;
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      width: 0%;
      transition: width 0.3s ease;
    }

    .nav-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px;
      list-style: none;
    }

    .nav-section-title {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      padding: 14px 12px 6px;
      font-weight: 700;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      margin-bottom: 3px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #cbd5e1;
      transition: all 0.2s ease;
      position: relative;
    }

    .nav-item:hover {
      background: #1e293b;
      color: #ffffff;
    }

    .nav-item.active {
      background: #1e293b;
      color: #ffffff;
      border-left: 4px solid var(--primary);
      font-weight: 600;
    }

    .nav-check {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      border: 1.5px solid #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: transparent;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .nav-check:hover {
      border-color: #38bdf8;
    }

    .nav-item.completed .nav-check {
      background: #10b981;
      border-color: #10b981;
      color: white;
    }

    .nav-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nav-badge {
      font-size: 0.68rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      flex-shrink: 0;
    }

    .nav-badge.tbd {
      background: rgba(245, 158, 11, 0.2);
      color: #fcd34d;
    }

    .sidebar-footer {
      padding: 14px 20px;
      border-top: 1px solid #1e293b;
      font-size: 0.75rem;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #f8fafc;
    }

    .topbar {
      height: 64px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar-station-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #9a3412;
      background: var(--primary-light);
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid rgba(249, 157, 30, 0.35);
    }

    .mark-done-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 20px;
      border: 1.5px solid #cbd5e1;
      background: white;
      color: var(--slate);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mark-done-btn:hover {
      border-color: #10b981;
      color: #065f46;
    }

    .mark-done-btn.is-done {
      background: #ecfdf5;
      border-color: #10b981;
      color: #065f46;
    }

    .topbar-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: var(--dark);
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    .btn-primary {
      background: var(--primary);
      color: #0f172a;
      font-weight: 700;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      color: #ffffff;
    }

    .slide-footer-nav {
      padding: 20px 36px;
      background: #f8fafc;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .slide-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 32px 48px;
    }

    .slide-card {
      max-width: 980px;
      margin: 0 auto 30px;
      background: #ffffff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .slide-header {
      padding: 32px 36px 20px;
      border-bottom: 1px solid #f1f5f9;
    }

    .slide-kicker {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .slide-title {
      font-size: 1.85rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.25;
    }

    .slide-subtitle {
      margin-top: 8px;
      font-size: 1.02rem;
      color: var(--slate);
      line-height: 1.5;
    }

    .slide-body {
      padding: 32px 36px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin: 20px 0;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 20px 0;
    }

    .info-box {
      padding: 18px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f8fafc;
    }

    .info-box.highlight {
      border-left: 4px solid var(--primary);
      background: #fff8f9;
    }

    .info-box.tip {
      border-left: 4px solid var(--secondary);
      background: #f0fdf4;
    }

    .info-box.code-box {
      border-left: 4px solid var(--accent);
      background: #f0f7ff;
    }

    .info-box.warning-box {
      border-left: 4px solid var(--warning);
      background: #fffbeb;
    }

    .info-box h3 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-box p, .info-box ul, .info-box ol {
      font-size: 0.88rem;
      line-height: 1.55;
      color: var(--slate);
    }

    .info-box ul, .info-box ol {
      padding-left: 20px;
    }

    .info-box li {
      margin-bottom: 6px;
    }

    .terminal {
      background: #1e1e2e;
      color: #cdd6f4;
      border-radius: 8px;
      padding: 16px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
      font-size: 0.85rem;
      margin: 16px 0;
      position: relative;
      overflow-x: auto;
    }

    .terminal-header {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .terminal-circle {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .tc-red { background: #f38ba8; }
    .tc-yellow { background: #f9e2af; }
    .tc-green { background: #a6e3a1; }

    .terminal code {
      color: #a6e3a1;
      display: block;
      line-height: 1.5;
    }

    .terminal .comment {
      color: #6c7086;
    }

    /* Table styles */
    .styled-table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 0.88rem;
    }

    .styled-table th {
      background: #f1f5f9;
      color: #1e293b;
      font-weight: 700;
      text-align: left;
      padding: 10px 14px;
      border-bottom: 2px solid var(--border);
    }

    .styled-table td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--slate);
      vertical-align: top;
    }

    .styled-table tr:hover {
      background: #f8fafc;
    }

    /* Interactive Quiz Section */
    .quiz-container {
      margin-top: 24px;
      padding: 24px;
      background: #f1f5f9;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
    }

    .quiz-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .quiz-question {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #1e293b;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quiz-option {
      padding: 12px 16px;
      background: white;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quiz-option:hover {
      border-color: var(--accent);
      background: #f8fafc;
    }

    .quiz-option.correct {
      border-color: var(--secondary);
      background: #ecfdf5;
      color: #065f46;
      font-weight: 600;
    }

    .quiz-option.incorrect {
      border-color: #ef4444;
      background: #fef2f2;
      color: #991b1b;
    }

    .quiz-feedback {
      margin-top: 14px;
      font-size: 0.88rem;
      font-weight: 500;
      display: none;
      padding: 10px 14px;
      border-radius: 6px;
    }

    .quiz-feedback.success {
      display: block;
      background: #d1fae5;
      color: #065f46;
    }

    .quiz-feedback.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    /* Checklist component */
    .checklist {
      margin: 16px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .check-item:hover {
      background: #f8fafc;
    }

    .check-item input[type="checkbox"] {
      margin-top: 3px;
      cursor: pointer;
      width: 18px;
      height: 18px;
      accent-color: var(--secondary);
    }

    /* Mobile layout */
    .sidebar-toggle {
      display: none;
      background: none;
      border: none;
      color: #f1f5f9;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 0 4px;
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
        height: auto;
        overflow: auto;
      }
      .sidebar {
        width: 100%;
        flex-shrink: 0;
      }
      .sidebar-toggle {
        display: block;
      }
      .nav-list {
        display: none;
      }
      .nav-list.open {
        display: block;
      }
      .main-content {
        overflow: visible;
      }
      .slide-viewport {
        overflow: visible;
        padding: 16px;
      }
      .topbar {
        padding: 0 16px;
        flex-wrap: wrap;
        height: auto;
        gap: 8px;
        padding-top: 10px;
        padding-bottom: 10px;
      }
      .grid-2, .grid-3 {
        grid-template-columns: 1fr;
      }
      .slide-header, .slide-body {
        padding: 20px;
      }
      .slide-footer-nav {
        padding: 16px 20px;
      }
    }

    @media print {
      body {
        display: block !important;
        height: auto !important;
        overflow: visible !important;
        background: white !important;
        color: black !important;
      }
      .sidebar, .topbar, .slide-footer-nav, .sidebar-toggle, .mark-done-btn {
        display: none !important;
      }
      .main-content, .slide-viewport {
        overflow: visible !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
      }
      .slide-card {
        box-shadow: none !important;
        border: none !important;
        max-width: 100% !important;
        margin: 0 !important;
      }
      .slide-header, .slide-body {
        padding: 12px 0 !important;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <img src="pi-academy-logo.png" alt="The Pi Academy Logo" onerror="this.parentElement.innerHTML='<span style=\'color:#f99d1e;font-size:24px;font-weight:800;\'>π</span>'">
      </div>
      <div class="brand-title">
        <h1>The Pi Academy</h1>
        <p>Florida Camp Volunteer Portal</p>
      </div>
      <button class="sidebar-toggle" onclick="document.getElementById('nav-list').classList.toggle('open')" aria-label="Toggle navigation">☰</button>
    </div>

    <div class="progress-bar-container">
      <div class="progress-header">
        <span>Training Completion</span>
        <span id="progress-percent">0 of 10 (0%)</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <ul class="nav-list" id="nav-list">
      <!-- Generated dynamically in JavaScript -->
    </ul>

    <div class="sidebar-footer">
      <span>Florida Youth Coding Camp</span>
      <span>v2026.3</span>
    </div>
  </aside>

  <!-- Main Viewport -->
  <main class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <div id="station-badge" class="topbar-station-tag">
          🏛️ Module 1
        </div>
        <button id="mark-done-toggle" class="mark-done-btn" onclick="toggleModuleCompletion()">
          <span>✓</span> <span id="mark-done-label">Mark as Done</span>
        </button>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-secondary" onclick="window.print()" title="Print current module" aria-label="Print current module" style="padding: 8px 12px;">🖨️ Print</button>
        <button class="btn btn-secondary" onclick="prevSlide()">← Previous</button>
        <button class="btn btn-primary" onclick="nextSlide()">Next Module →</button>
      </div>
    </div>

    <div class="slide-viewport">
      <div id="slide-content" class="slide-card">
        <!-- Rendered dynamically via JavaScript -->
      </div>
    </div>
  </main>

  <script>
    // Module Data aligned to user specification
    const slides = [
      {
        kicker: "Module 1 • Organization Overview",
        title: "Who is The Pi Academy?",
        category: "🏛️ Who is The Pi Academy",
        section: "Camp Overview",
        label: "1. Who is The Pi Academy?",
        icon: "🏛️",
        badge: "Overview",
        subtitle: "A non-profit organization dedicated to empowering underrepresented youth through coding education and mentorship.",
        body: `
          <div class="grid-2">
            <div class="info-box highlight">
              <h3>🎯 Our Mission & Goals (<a href="https://www.thepiacademy.org" target="_blank" style="color: var(--primary); text-decoration: underline;">thepiacademy.org</a>)</h3>
              <p><strong>Mission:</strong> To empower underrepresented youth to pursue careers in technology by providing accessible, engaging, and culturally relevant coding education and mentorship.</p>
              <p style="margin-top: 8px;"><strong>Goals:</strong> To inspire and equip underrepresented youth to become the next generation of tech leaders and innovators, driving positive change in our community and beyond.</p>
            </div>
            <div class="info-box tip">
              <h3>🌟 The Flagship Camp (Ages 10–13)</h3>
              <p>The <strong>Raspberry Pi Youth Coding Camp</strong> is The Pi Academy's flagship program for middle school students. We teach students how to transition from passive consumers of tech to creative programmers, hardware makers, and problem solvers.</p>
              <p style="margin-top: 8px;"><strong>Take-Home Tech:</strong> Every camper takes home a complete Raspberry Pi computer desktop—including a monitor, keyboard, and mouse—so they can continue learning and creating beyond camp.</p>
            </div>
          </div>

          <div class="info-box highlight" style="margin-top: 15px;">
            <h3>🤝 Your Role as a Mentor: Creating Belonging</h3>
            <p>You are more than a technical helper—you are a mentor who shows every student that they belong in STEM.</p>
            <ul style="margin-top: 8px;">
              <li><strong>Learn their names & ask about their interests:</strong> Connect coding concepts to things they already love (gaming, sports, art, music, community).</li>
              <li><strong>Connect activities to real tech careers:</strong> Point out how the skills they practice today power robotics engineering, game development, cybersecurity, and web design.</li>
              <li><strong>Foster genuine belonging:</strong> Help every student leave camp thinking: <em>"I can do this, and there is a place for me in technology."</em></li>
            </ul>
          </div>

          <div class="info-box code-box" style="margin-top: 15px;">
            <h3>⭐ Hands-On Mentoring: Let Campers Lead</h3>
            <p><strong>"Let campers lead whenever possible. Use questions and hints to help them work through coding challenges. When direct assistance is needed, explain what you are doing, ask permission before taking control, and return control promptly."</strong></p>
            <p style="margin-top: 8px; font-size: 0.84rem; color: #475569;"><em>Key Distinction:</em> Distinguish between a <strong>learning challenge</strong> (a bug, typo, or logic hurdle—guide them through questions so they solve it) vs. a <strong>technical issue</strong> (dropped Wi-Fi, hardware disconnect, crashed OS—step in transparently with permission to fix the blocker so they can keep learning).</p>
          </div>

          <div class="grid-3" style="margin-top: 20px;">
            <div class="info-box">
              <h3>🤝 Respect & Belonging</h3>
              <p>Students bring diverse backgrounds and experiences. Meet every camper where they are with warmth, respect, and encouragement.</p>
            </div>
            <div class="info-box">
              <h3>🚀 Celebrate Experimentation & Persistence</h3>
              <p>Praise effort, creative attempts, and teamwork alongside successful runs. Emphasize that persistence through obstacles is how real engineers succeed.</p>
            </div>
            <div class="info-box">
              <h3>🎉 Welcoming & Inclusive Atmosphere</h3>
              <p>Celebrate breakthroughs and team victories, while ensuring quieter and observant campers feel equally valued, comfortable, and heard.</p>
            </div>
          </div>
        `
      },
      {
        kicker: "Module 2 • Hardware Fundamentals",
        title: "An Introduction to Raspberry Pi",
        category: "🍓 Intro to Raspberry Pi",
        section: "Camp Overview",
        label: "2. Intro to Raspberry Pi",
        icon: "🍓",
        badge: "Hardware",
        subtitle: "Essential hardware checklist, OS flashing with Raspberry Pi Imager, first boot steps, and key troubleshooting.",
        body: `
          <div style="margin-bottom: 16px; background: var(--secondary-light); border: 1px solid var(--secondary); border-radius: 8px; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="font-size: 1.25rem;">📄</span>
              <span style="color: var(--secondary-dark); font-weight: 600; font-size: 0.92rem;">Official Resource</span>
            </div>

              <li><strong>Meet Campers Where They Are:</strong> Build courses using items in the room (tape, water bottles, boxes, chairs). Start with an easy straight shot, then add 90° turns, slalom curves, or reverse navigation as students gain confidence!</li>

          <div class="info-box tip" style="margin-top: 15px;">
            <h3>📋 Station Notes & Progressive Challenges</h3>
            <ol>
              <li><strong>Part 1 (Out & Back):</strong> Drive 10 feet straight out, turn 180°, and return 10 feet to base.</li>
              <li><strong>Part 2 (Square Route):</strong> Drive in a square (10 feet on all four sides) using 90° turns to return to origin.</li>

              <li><strong>Extension Challenges:</strong>
                <ul>
                  <li>Navigate the course entirely in reverse.</li>
                  <li>Compare control modes: Bloxter blocks vs. Python API (<code>move_seconds</code>, <code>move_inches</code>, or wheel circumference degrees).</li>
                  <li>Drive Mode (manual joystick driving through the web UI) for quick orientation before coding.</li>

          <div class="info-box warning-box" style="margin-top: 15px;">
            <h3>🔌 Teardown & Battery Care</h3>

            2. Power off the GoPiGo using the side button, wait a few seconds, then <strong>unplug the battery cable from the battery pack</strong> to prevent draining the AA batteries between sessions.</p>
          </div>
        `
      },
      {
        kicker: "Station 6 • Computer Vision Robotics",
        title: "GoPiGo Pi Photo Station",
        category: "📷 GoPiGo Pi Photo",
        section: "Camp Stations",
        label: "9. GoPiGo Pi Photo",
        icon: "📷",
        badge: "Pi Camera",
        subtitle: "Navigate an obstacle course to a target pie on the wall, snap a photo, and return to home base.",
        body: `
          <div class="grid-2">

              <h3>🎯 What the Station Is</h3>

      {
        kicker: "Module 10 • Final Preparation",
        title: "Day 1 Volunteer Readiness Checklist",

        label: "10. Day 1 Readiness",
        icon: "🎓",
        badge: "Checklist",
        subtitle: "Verify your readiness before middle school campers arrive! Check off each item below to complete your training.",
        body: `
          <div class="checklist">
            <label class="check-item">
              <input type="checkbox" onchange="updateReadinessChecklist()">

              <input type="checkbox" onchange="updateReadinessChecklist()">

            </label>
          </div>

          <div id="completion-banner" class="info-box tip" style="display: none; margin-top: 25px; border-left: 4px solid #10b981; background: #ecfdf5; padding: 24px; text-align: center;">
            <div style="font-size: 2.5rem; margin-bottom: 8px;">🎉 🏆 🎓</div>
            <h3 style="color: #065f46; font-size: 1.3rem; justify-content: center; font-weight: 800;">Congratulations! You Are Ready for Florida Camp!</h3>
            <p style="color: #047857; margin-top: 8px; font-size: 0.95rem;">You have verified all readiness items and completed The Pi Academy Volunteer Training.</p>
            <div style="margin-top: 18px; display: inline-flex; gap: 12px; flex-wrap: wrap; justify-content: center;">
              <button class="btn btn-primary" onclick="window.print()" style="background: #10b981; color: white;">🖨️ Print Completion Checklist & Guide</button>
              <button class="btn btn-secondary" onclick="resetProgress()" style="font-size: 0.8rem;">Reset Progress</button>
            </div>
          </div>
        `
      }
    ];

    let currentSlide = 0;
    const completedSlides = new Set();

    // LocalStorage Persistence
    function loadSavedState() {
      try {
        const savedDone = localStorage.getItem("pi_camp_completed");
        if (savedDone) {
          JSON.parse(savedDone).forEach(idx => completedSlides.add(idx));
        }
        const savedSlide = localStorage.getItem("pi_camp_current_slide");
        if (savedSlide !== null) {
          const parsed = parseInt(savedSlide);
          if (!isNaN(parsed) && parsed >= 0 && parsed < slides.length) {
            currentSlide = parsed;
          }
        }
      } catch (e) {
        console.warn("Could not load saved state", e);
      }
    }

    function persistState() {
      try {
        localStorage.setItem("pi_camp_completed", JSON.stringify([...completedSlides]));
        localStorage.setItem("pi_camp_current_slide", currentSlide.toString());
      } catch (e) {
        console.warn("Could not save state", e);
      }
    }

    function persistChecklistState() {
      try {
        const checkboxes = document.querySelectorAll(".checklist input[type='checkbox']");
        if (checkboxes.length > 0) {
          const state = Array.from(checkboxes).map(cb => cb.checked);
          localStorage.setItem("pi_camp_checklist", JSON.stringify(state));
        }
      } catch (e) {}
    }

    function restoreChecklistState() {
      try {
        const saved = localStorage.getItem("pi_camp_checklist");
        if (saved) {
          const state = JSON.parse(saved);
          const checkboxes = document.querySelectorAll(".checklist input[type='checkbox']");
          checkboxes.forEach((cb, i) => {
            if (state[i] !== undefined) cb.checked = state[i];
          });
          updateReadinessChecklist(false);
        }
      } catch (e) {}
    }

    function resetProgress() {
      if (confirm("Reset your volunteer training completion progress?")) {
        completedSlides.clear();
        try {
          localStorage.removeItem("pi_camp_completed");
          localStorage.removeItem("pi_camp_current_slide");
          localStorage.removeItem("pi_camp_checklist");
        } catch (e) {}
        loadSlide(0);
      }
    }

    // Build nav once; updateNav() only flips classes.
    function buildNav() {
      const navList = document.getElementById("nav-list");
      navList.innerHTML = "";
      let currentSection = "";
      slides.forEach((slide, idx) => {
        if (slide.section !== currentSection) {
          currentSection = slide.section;
          const secTitle = document.createElement("li");
          secTitle.className = "nav-section-title";
          secTitle.innerText = currentSection;
          navList.appendChild(secTitle);
        }
        const li = document.createElement("li");
        li.dataset.idx = idx;
        li.className = "nav-item";
        li.tabIndex = 0;
        li.onkeydown = (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            loadSlide(idx);
          }
        };
        li.onclick = (e) => {
          if (e.target.closest(".nav-check")) { e.stopPropagation(); toggleCheck(idx); return; }
          loadSlide(idx);
        };
        li.innerHTML = `
          <div class="nav-check" title="Toggle completed">✓</div>
          <span style="font-size:1.05rem">${slide.icon}</span>
          <span class="nav-label">${slide.label}</span>
          ${slide.badge ? `<span class="nav-badge ${slide.badge === 'TBD' ? 'tbd' : ''}">${slide.badge}</span>` : ""}
        `;
        navList.appendChild(li);
      });
    }

    function updateNav() {
      document.querySelectorAll(".nav-item").forEach((li) => {
        const idx = parseInt(li.dataset.idx);
        li.className = "nav-item" +
          (idx === currentSlide ? " active" : "") +
          (completedSlides.has(idx) ? " completed" : "");
      });
    }

    function toggleCheck(idx) {
      if (completedSlides.has(idx)) {
        completedSlides.delete(idx);
      } else {
        completedSlides.add(idx);
      }
      updateUI();
      persistState();
    }

    function toggleModuleCompletion() {
      toggleCheck(currentSlide);
    }

    function loadSlide(index) {
      if (index < 0 || index >= slides.length) return;
      currentSlide = index;

      // Close mobile menu if open
      const navList = document.getElementById("nav-list");
      if (navList && navList.classList.contains("open")) {
        navList.classList.remove("open");
      }

      const s = slides[currentSlide];
      const isFirst = currentSlide === 0;
      const isLast = currentSlide === slides.length - 1;
      const isDone = completedSlides.has(currentSlide);

      const container = document.getElementById("slide-content");
      container.innerHTML = `
        <div class="slide-header">
          <div class="slide-kicker">${s.kicker}</div>
          <h2 class="slide-title">${s.title}</h2>
          <p class="slide-subtitle">${s.subtitle}</p>
        </div>
        <div class="slide-body">
          ${s.body}
        </div>
        <div class="slide-footer-nav">
          <button class="btn btn-secondary" onclick="prevSlide()" ${isFirst ? 'style="visibility:hidden;"' : ''}>← Previous Module</button>
          <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
            <button class="mark-done-btn ${isDone ? 'is-done' : ''}" onclick="toggleModuleCompletion()">
              <span>✓</span> <span>${isDone ? 'Completed ✓' : 'Mark as Done'}</span>
            </button>
            ${isLast ? `
              <button class="btn btn-primary" onclick="markAndFinish()">Finish Training 🎉</button>
            ` : `
              <button class="btn btn-primary" onclick="nextSlide()">Next Module →</button>
            `}
          </div>
        </div>
      `;

      document.getElementById("station-badge").innerText = s.category;

      if (isLast) {
        restoreChecklistState();
      }

      updateUI();
      persistState();

      document.querySelector(".slide-viewport").scrollTop = 0;
    }

    function markAndFinish() {
      completedSlides.add(currentSlide);
      updateUI();
      persistState();
      const banner = document.getElementById("completion-banner");
      if (banner) {
        banner.style.display = "block";
        banner.scrollIntoView({ behavior: "smooth" });
      }
    }

    function nextSlide() {
      completedSlides.add(currentSlide);
      if (currentSlide < slides.length - 1) {
        loadSlide(currentSlide + 1);
      } else {
        updateUI();
        persistState();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        loadSlide(currentSlide - 1);
      }
    }

    function updateUI() {
      const isDone = completedSlides.has(currentSlide);
      const markBtn = document.getElementById("mark-done-toggle");
      const markLabel = document.getElementById("mark-done-label");
      if (markBtn && markLabel) {
        if (isDone) {
          markBtn.classList.add("is-done");
          markLabel.innerText = "Completed ✓";
        } else {
          markBtn.classList.remove("is-done");
          markLabel.innerText = "Mark as Done";
        }
      }

      // Sync footer mark done button if present
      const footerMarkBtn = document.querySelector(".slide-footer-nav .mark-done-btn");
      if (footerMarkBtn) {
        if (isDone) {
          footerMarkBtn.classList.add("is-done");
          footerMarkBtn.innerHTML = "<span>✓</span> <span>Completed ✓</span>";
        } else {
          footerMarkBtn.classList.remove("is-done");
          footerMarkBtn.innerHTML = "<span>✓</span> <span>Mark as Done</span>";
        }
      }

      updateNav();

      const count = completedSlides.size;
      const total = slides.length;
      const pct = Math.round((count / total) * 100);
      document.getElementById("progress-percent").innerText = `${count} of ${total} (${pct}%)`;
      document.getElementById("progress-fill").style.width = pct + "%";
    }

    function updateReadinessChecklist(autoCheckSlide = true) {
      persistChecklistState();
      const checkboxes = document.querySelectorAll(".checklist input[type='checkbox']");
      const allChecked = Array.from(checkboxes).length > 0 && Array.from(checkboxes).every(cb => cb.checked);
      const banner = document.getElementById("completion-banner");
      if (banner) {
        banner.style.display = allChecked ? "block" : "none";
      }
      if (allChecked && autoCheckSlide) {
        completedSlides.add(currentSlide);
        updateUI();
        persistState();
      }
    }

    // Keyboard navigation
    window.addEventListener("keydown", (e) => {
      if (["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) return;
      if (e.key === "ArrowRight") {
        e.preventDefault();
        nextSlide();
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        prevSlide();
      } else if (e.key.toLowerCase() === "m") {
        e.preventDefault();
        toggleModuleCompletion();
      }
    });

    // Initialize
    loadSavedState();
    buildNav();
    loadSlide(currentSlide);
  </script>
